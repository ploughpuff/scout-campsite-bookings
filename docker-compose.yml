services:
  scout-campsite-bookings:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_ENV: production
    image: scout-campsite-bookings:latest
    container_name: scout-campsite-bookings-container
    ports:
      - "8080:80"
    volumes:
      - ./docker-mnt/data:/app/data
      - ./docker-mnt/email_templates:/app/email_templates
      - ./docker-mnt/config:/app/config
    env_file:
      - ./docker-mnt/config/.env.production
    restart: always
    environment:
      - APP_ENV=production
